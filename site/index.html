<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stinoo.dev</title>
<meta name="description" content="stinoo.dev: my projects, work and stack, opened in an editor.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/intros/shared/frame.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<main class="stage">
  <header class="frame-top">
    <a class="brand" href="/" data-tip="back to the intro"><svg viewBox="0 0 88 80" aria-hidden="true"><path d="M8 16L36 40L8 64L18 74L54 40L18 6Z"/><path d="M52 62H84V74H52Z"/></svg><span>stinoo.dev</span></a>
    <nav class="switch" aria-label="Elsewhere">
      <button class="search-open" type="button" aria-haspopup="dialog" aria-expanded="false" aria-keyshortcuts="/ Control+K Meta+K" data-tip="search every project, job and tool · / or ctrl k">search <kbd>/</kbd></button>
      <button class="sound-toggle" type="button" aria-pressed="true" data-tip="interface sounds, made live in your browser">sound on</button>
      <a href="/simple/" data-tip="the same, as a plain page">simple version</a><a href="https://github.com/stinoooo" rel="me">github</a></nav>
  </header>

  <h1 class="sr-only">Stijn Heemskerk: projects, work and stack</h1>

  <section class="editor" aria-label="Editor">
    <button class="tabline" type="button" aria-expanded="false" aria-controls="tree"><span class="tab-dir">~/Projects</span><span class="tab-file"></span><span class="tab-toggle" aria-hidden="true">↓</span></button>
    <nav class="wheel" id="tree" aria-label="Projects, themes and the log"></nav>
    <div class="pane">
      <p class="winbar"></p>
      <div class="buffer" tabindex="0" aria-live="polite"></div>
    </div>
  </section>

  <div class="bar">
    <p class="bar-id" aria-hidden="true"><span class="bar-title">STIJN HEEMSKERK</span><span class="bar-sub"><span class="cmd"></span><span class="hunt"></span><span class="keys"></span></span></p>
    <div class="bar-cols" aria-hidden="true"></div>
    <p class="bar-graph" aria-hidden="true"><span class="label span">VISITORS</span><span class="value end"></span><canvas></canvas></p>
  </div>
</main>
<script type="module" src="editor.js"></script>
</body>
</html>
